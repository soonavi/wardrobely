name: CI

# The checks in this workflow (typecheck, tests, lint) all passed at the time
# it was added. The point of running them here is to keep it that way: before
# this existed, nothing in CI executed them, so a regression could land on
# main unnoticed.

on:
  pull_request:
  push:
    branches: [main]

# Read-only is all this job needs. It builds nothing, publishes nothing, and
# comments nowhere — it only reads the checked-out tree and reports pass/fail
# through the check itself.
permissions:
  contents: read

# A new push to a PR makes the in-flight run for the older commit irrelevant,
# so cancel it rather than paying for a result nobody will read. Runs on main
# are keyed by ref too, but are not cancelled: main's history is the record of
# which commits were actually verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    # Everything lives in app/ — the repo root holds docs, brand assets and
    # the landing page, and has no package.json of its own.
    defaults:
      run:
        working-directory: app

    # Actions are pinned to full commit SHAs rather than tags or branches,
    # matching the convention .github/workflows/security.yml establishes. A
    # tag is a mutable pointer: whoever controls the upstream repo can move
    # it, and the job would silently start running different code. To bump,
    # re-resolve the ref named in each trailing comment and review the diff.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the job has no use for a credential in
          # .git/config. Leaving it out means a compromised dependency run by
          # a later step cannot read a token out of the workspace.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Expo SDK 54 / React Native 0.81 support Node 20 and 22; 22 is the
          # active LTS line and what the project is developed against.
          node-version: 22
          cache: npm
          # `cache` resolves its key from a lockfile path relative to the repo
          # root, which `defaults.run.working-directory` does not affect.
          cache-dependency-path: app/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the lockfile and package.json have
      # drifted apart, instead of quietly resolving new versions and testing
      # something other than what a developer would get.
      - name: Install dependencies
        run: npm ci

      # The three checks are separate named steps so a red run names which one
      # broke in the job summary, without opening the log.
      #
      # Typecheck and tests run through their package.json scripts so CI and a
      # developer at a terminal invoke exactly the same command; there is no
      # second definition of "the typecheck" that can drift from `npm run
      # typecheck`.
      - name: Typecheck
        run: npm run typecheck

      # `--ci` makes jest fail on a missing snapshot rather than writing one,
      # so a snapshot that was never committed cannot pass by being created.
      # `!cancelled()` lets the remaining checks run even after an earlier one
      # fails, so one push reports every problem instead of one per re-run.
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test -- --ci

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
